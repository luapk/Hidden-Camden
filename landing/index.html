  .scrim { position:absolute; inset:0; background:
      radial-gradient(70% 55% at 16% 94%, rgba(204,255,0,0.12) 0%, rgba(6,6,6,0) 55%),
      linear-gradient(180deg, rgba(6,6,6,0.80) 0%, rgba(6,6,6,0.10) 24%, rgba(6,6,6,0.40) 60%, rgba(6,6,6,0.97) 100%),
      linear-gradient(90deg, rgba(6,6,6,0.76) 0%, rgba(6,6,6,0.14) 50%, rgba(6,6,6,0) 74%); }
  .vignette { position:absolute; inset:0; box-shadow:inset 0 0 220px 40px rgba(6,6,6,0.9); pointer-events:none; }
  .scan { position:absolute; inset:0; pointer-events:none; opacity:0.5; background-image:repeating-linear-gradient(to bottom, rgba(0,0,0,0) 0, rgba(0,0,0,0) 2px, rgba(0,0,0,0.16) 2px, rgba(0,0,0,0.16) 3px); }
  .grain { position:absolute; inset:0; pointer-events:none; opacity:0.10; mix-blend-mode:overlay;
      background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>"); }
  .frame { position:relative; min-height:100svh; min-height:100vh; display:flex; flex-direction:column; padding:clamp(18px,4vw,36px) var(--gutter) clamp(22px,4vw,40px); }
  .topbar { display:flex; justify-content:space-between; align-items:center; gap:16px; font-family:'Space Grotesk',monospace; font-weight:600; font-size:clamp(9px,1.4vw,11px); letter-spacing:0.34em; text-transform:uppercase; color:var(--acid); }
  .topbar .r { color:var(--acid); }
  .topbar .tt { text-align:right; line-height:1.3; }
  .topbar span{display:inline-flex;align-items:center;gap:0.5em;}
  footer .floc{display:inline-flex;align-items:center;gap:0.5em;}
  .ic{width:1.35em;height:1.35em;flex:none;}
  .partner{margin-left:auto;font-family:'Space Grotesk',monospace;font-weight:600;font-size:11px;letter-spacing:0.18em;text-transform:uppercase;color:var(--paper);background:none;border:1px solid rgba(255,255,255,0.35);border-radius:999px;padding:9px 20px;cursor:pointer;transition:background .2s ease,color .2s ease,border-color .2s ease;}
  .partner:hover{color:var(--black);background:var(--acid);border-color:var(--acid);}
  .portal{position:fixed;inset:0;z-index:60;background:var(--acid);color:var(--black);display:flex;opacity:0;pointer-events:none;transition:opacity .34s ease;}
  .portal.open{opacity:1;pointer-events:auto;}
  .portal .pclose{position:absolute;top:clamp(18px,4vw,34px);right:var(--gutter);width:44px;height:44px;display:flex;align-items:center;justify-content:center;border:2px solid var(--black);border-radius:50%;background:none;color:var(--black);cursor:pointer;}
  .portal .pclose svg{width:20px;height:20px;}
  .portal .pinner{margin:auto;width:100%;max-width:1120px;padding:clamp(40px,8vh,96px) var(--gutter);display:flex;flex-direction:column;align-items:center;text-align:center;gap:clamp(22px,4vh,40px);}
  .logo-inv{width:clamp(190px,30vw,380px);height:auto;color:var(--black);display:block;}
  .portal .plabel{font-family:'Space Grotesk',monospace;font-weight:600;font-size:clamp(10px,1.5vw,12px);letter-spacing:0.34em;text-transform:uppercase;color:rgba(6,6,6,0.65);}
  .portal form{width:100%;display:flex;flex-direction:column;align-items:center;gap:clamp(18px,3vh,30px);}
  .pw{width:100%;max-width:900px;background:transparent;border:0;border-bottom:4px solid rgba(6,6,6,0.25);color:var(--black);font-family:'Anton',sans-serif;font-weight:400;text-transform:uppercase;text-align:center;font-size:clamp(44px,11vw,124px);line-height:1;letter-spacing:0.06em;padding:0.08em 0 0.12em;outline:none;transition:border-color .2s ease;}
  .pw::placeholder{color:rgba(6,6,6,0.32);}
  .pw:focus{border-bottom-color:var(--black);}
  .pw::-ms-reveal,.pw::-ms-clear{display:none;}
  .pgo{font-family:'Space Grotesk',monospace;font-weight:700;font-size:13px;letter-spacing:0.18em;text-transform:uppercase;color:var(--acid);background:var(--black);border:0;border-radius:999px;padding:14px 30px;cursor:pointer;transition:transform .2s ease,opacity .2s ease;}
  .pgo:hover{transform:translateY(-1px);} .pgo:active{opacity:.85;}
  .pnote{min-height:1.2em;font-family:'Space Grotesk',monospace;font-size:12px;letter-spacing:0.08em;color:rgba(6,6,6,0.75);}
  @media (prefers-reduced-motion: no-preference){ .portal.open .pinner{animation:softUp .5s ease both;} }
  .rule { height:1px; background:linear-gradient(90deg, rgba(204,255,0,0.5), rgba(255,255,255,0.08)); margin-top:13px; }
  main { flex:1; display:flex; flex-direction:column; justify-content:flex-end; }
  .logo { width:clamp(214px,28vw,372px); height:auto; display:block; mix-blend-mode:screen; margin-top:clamp(14px,3.2vw,32px); margin-bottom:clamp(10px,1.8vw,20px); }
  h1 { font-family:'Anton',sans-serif; font-weight:400; text-transform:uppercase; line-height:0.9; letter-spacing:0.005em; color:#fff; font-size:clamp(30px,5.9vw,72px); text-shadow:0 4px 30px rgba(0,0,0,0.6); }
  .lede { margin-top:clamp(14px,2vw,22px); max-width:46ch; font-size:clamp(15px,1.75vw,19px); line-height:1.55; color:#d8d8d2; font-weight:500; }
  .lede .made { color:var(--acid); }
  footer { margin-top:clamp(22px,3.6vw,40px); padding-top:15px; border-top:1px solid rgba(255,255,255,0.12); display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:8px 18px; font-family:'Space Grotesk',monospace; font-weight:500; font-size:11px; letter-spacing:0.18em; text-transform:uppercase; color:var(--smoke); }
  footer a { color:var(--paper); text-decoration:none; }
  footer a:hover { color:var(--acid); }
  .stamp-anchor { position:relative; display:inline-block; width:0; height:0; vertical-align:baseline; }
  .stamp { background-image:var(--coming-soon); background-size:contain; background-repeat:no-repeat; background-position:center; aspect-ratio:560/515; filter:drop-shadow(0 16px 34px rgba(0,0,0,0.5)); }
  .stamp--pin { position:absolute; z-index:5; left:-0.30em; bottom:0.20em; width:clamp(118px,16vw,172px); transform:rotate(-5deg); pointer-events:none; }
  .stamp--flow { display:none; }
  .stamp:hover { transform:rotate(-1deg) scale(1.05); }

  .sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0;}
  h1 .lines{display:block;} h1 .line{display:block;white-space:nowrap;} h1 .ch{display:inline-block;}
  h1 .sp{display:inline-block;width:0.26em;} h1 .em{color:var(--acid);}
  @media (prefers-reduced-motion: no-preference){
    .topbar{animation:softUp .7s ease .10s both;}
    .rule{animation:ruleIn .7s cubic-bezier(.2,.7,.2,1) .24s both; transform-origin:left center;}
    .logo{animation:softUp .8s cubic-bezier(.2,.7,.2,1) .40s both;}
    h1 .ch{animation:letterIn .55s cubic-bezier(.2,.75,.25,1) both;}
    .lede{animation:softUp .8s ease 1.05s both;}
    footer{animation:softUp .7s ease 1.22s both;}

  (function(){
    var btn=document.getElementById('partnerBtn'),portal=document.getElementById('portal'),
        close=document.getElementById('portalClose'),form=document.getElementById('partnerForm'),
        note=document.getElementById('portalNote'),pw=document.getElementById('pw');
    function show(){portal.classList.add('open');document.body.style.overflow='hidden';setTimeout(function(){pw.focus();},140);}
    function hide(){portal.classList.remove('open');document.body.style.overflow='';note.textContent='';pw.value='';}

    close.addEventListener('click',hide);
    document.addEventListener('keydown',function(e){if(e.key==='Escape'&&portal.classList.contains('open'))hide();});
