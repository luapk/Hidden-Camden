<style>
  :root {
    --ink: #0a0a0a;
    --acid: #ccff00;
    --paper: #f4f4f1;
    --grey: #9a9a95;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    background: var(--ink);
    color: var(--paper);
    font-family: 'Jost', system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
    overflow-x: hidden;
    /* subtle vignette so flat black has some depth, like the hero shot */
    background-image:
      radial-gradient(120% 90% at 85% 15%, rgba(255,255,255,0.05) 0%, rgba(10,10,10,0) 55%),
      radial-gradient(100% 100% at 50% 120%, rgba(204,255,0,0.05) 0%, rgba(10,10,10,0) 60%);
  }

  .wrap {
    position: relative;
    min-height: 100%;
    max-width: 920px;
    margin: 0 auto;
    padding: clamp(28px, 6vw, 72px) clamp(22px, 6vw, 64px) clamp(40px, 8vw, 96px);
    display: flex;
    flex-direction: column;
    justify-content: center;
  }

  .logo {
    width: clamp(220px, 42vw, 360px);
    height: auto;
    display: block;
    margin-bottom: clamp(26px, 5vw, 48px);
    filter: drop-shadow(0 0 28px rgba(204,255,0,0.18));
  }

  h1 {
    font-family: 'Jost', sans-serif;
    font-weight: 800;
    text-transform: uppercase;
    letter-spacing: -0.015em;
    line-height: 0.92;
    font-size: clamp(42px, 10.5vw, 104px);
    color: var(--paper);
    max-width: 12ch;
  }

  .lede {
    margin-top: clamp(22px, 4vw, 34px);
    max-width: 48ch;
    font-size: clamp(16px, 2.4vw, 21px);
    line-height: 1.5;
    color: var(--grey);
    font-weight: 500;
  }
  .lede .made {
    color: var(--acid);
    text-decoration: underline;
    text-decoration-thickness: 2px;
    text-underline-offset: 3px;
  }

  /* Acid circular stamp */
  .stamp-row {
    margin-top: clamp(34px, 6vw, 56px);
  }
  .stamp {
    position: relative;
    width: clamp(132px, 26vw, 178px);
    height: clamp(132px, 26vw, 178px);
    border-radius: 50%;
    background: var(--acid);
    color: var(--ink);
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    transform: rotate(-9deg);
    box-shadow: 0 16px 38px rgba(0,0,0,0.55), 0 2px 0 rgba(0,0,0,0.25);
    transition: transform 0.35s cubic-bezier(.2,.8,.2,1);
  }
  .stamp:hover { transform: rotate(-3deg) scale(1.04); }
  /* inner ring, like a pressed sticker */
  .stamp::before {
    content: "";
    position: absolute;
    inset: 9px;
    border-radius: 50%;
    border: 2px solid rgba(10,10,10,0.55);
  }
  .stamp span {
    font-family: 'Space Grotesk', monospace;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.22em;
    font-size: clamp(14px, 3.2vw, 19px);
    line-height: 1.25;
    /* nudge for the right-hand letter-spacing so text stays centred */
    padding-left: 0.22em;
  }
  .stamp .star {
    display: block;
    font-size: 0.7em;
    letter-spacing: 0;
    margin-bottom: 3px;
  }

  footer {
    margin-top: clamp(44px, 8vw, 72px);
    display: flex;
    flex-wrap: wrap;
    gap: 8px 18px;
    align-items: center;
    font-family: 'Space Grotesk', monospace;
    font-size: 11px;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: #5f5f5a;
  }
  footer a { color: var(--acid); text-decoration: none; }
  footer a:hover { text-decoration: underline; }

  /* On wider screens, slap the stamp into the top-right like a real sticker */
  @media (min-width: 760px) {
    .stamp-row { position: absolute; top: clamp(40px, 7vw, 84px); right: clamp(24px, 6vw, 64px); margin: 0; }
  }
</style>
